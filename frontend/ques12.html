<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Formatting Example</title>
</head>
<body>
    <p>
        Learning web development is <strong>fun</strong> and <em>challenging</em> at the same time.<br>
        I always <mark>practice</mark> daily to improve my skills. 
        <small>(Consistency is key!)</small>
    </p>
</body>
</html>
